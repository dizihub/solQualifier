databases:
  - name: ltts-maturity-db
    plan: free

services:
  - type: web
    name: ltts-maturity
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ltts-maturity-db
          property: connectionString
